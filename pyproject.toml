[project]
name = "voicelab"
version = "0.1.0"
description = "VoiceLab — ElevenLabs voice/persona design + comparison playground."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Arslan Kazmi" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gradio>=4.44",
    "pydantic-settings>=2.5",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.20",
    "tenacity>=9.1.4",
    "kokoro-onnx>=0.4.0",
    "piper-tts>=1.4.0",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
cloud = ["elevenlabs>=1.0"]
audio = ["soundfile>=0.12"]
# Kokoro ONNX TTS — torch-free, CPU/cross-platform (Apache-2.0 / MIT)
# Weights (~88 MB) are downloaded from HF hub on first use.
kokoro = ["kokoro-onnx>=0.4.0", "huggingface-hub>=0.20"]
# Piper ONNX TTS — torch-free, CPU/cross-platform (MIT)
# Voice models (.onnx) are downloaded from HF hub on first use.
piper = ["piper-tts>=1.4.0", "huggingface-hub>=0.20"]
# Chatterbox TTS — keyless local voice cloning (MIT) — PULLS TORCH
# Heavy: ~1.5 GB download. Only install when you need keyless cloning.
clone = ["chatterbox-tts>=0.1.0"]

[project.scripts]
voicelab = "voicelab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "mypy>=1.10", "ruff>=0.4"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicelab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
