[project]
name = "voicelab"
version = "0.1.0"
description = "VoiceLab — ElevenLabs voice/persona design + comparison playground."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Arslan Kazmi" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gradio>=4.44",
    "pydantic-settings>=2.5",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
cloud = ["elevenlabs>=1.0"]

[project.scripts]
voicelab = "voicelab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicelab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
