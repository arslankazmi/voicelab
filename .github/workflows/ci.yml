name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check voicelab tests

      - name: Format check (ruff)
        run: uv run ruff format --check voicelab tests

      - name: Type check (mypy)
        run: uv run mypy voicelab

      - name: Tests
        run: uv run pytest -q
